name: GitGuardian scan

on: 
  # Run on pushes and pull requests
  push:
  pull_request:
  # Allow manual triggers too
  workflow_dispatch:

jobs:
  scanning:
    name: GitGuardian scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Crucial: fetch all history for  full scans
      
      - name: GitGuardian Full scan
        uses: GitGuardian/ggshield/actions/setup@v1.46.0

      - name: Run full repository scan (history + working tree)
        run: ggshield secret scan repo --all --show-secrets .
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
