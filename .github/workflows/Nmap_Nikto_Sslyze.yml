name: Security Scans

on:
  workflow_dispatch:   # manual trigger; you can add push/PR if needed

jobs:
  scans:
    runs-on: ubuntu-latest
    env: 
      TARGET_URL: "http://altoro.testfire.net/"
      TARGET_HOST_URL: "altoro.testfire.net"
      REPORTS_DIR: reports

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Network Scan - Nmap ----
      - name: Nmap Scan
        run: |
          mkdir -p $REPORTS_DIR/nmap
          HOST=$(echo "$TARGET_URL" | sed 's~http[s]*://~~')
          docker run --rm -v $(pwd)/$REPORTS_DIR/nmap:/data uzyexe/nmap \
            -Pn -p 80,443 -v -sV -A -oX /data/nmap.xml $HOST || true
          ls -alR $REPORTS_DIR
          cat $REPORTS_DIR/nmap/nmap.xml || true

      # ---- Network Scan - Nikto ----
      - name: Nikto Scan
        run: |
          mkdir -p $REPORTS_DIR/nikto
          HOST=$(echo "$TARGET_URL" | sed 's~http[s]*://~~')
          docker run --rm -u 0 -v $(pwd)/$REPORTS_DIR/nikto:/report secfigo/nikto \
            -h $HOST -Tuning 123b -output /report/nikto-output.xml || true
          ls -alR $REPORTS_DIR
          cat $REPORTS_DIR/nikto/nikto-output.xml || true

      # ---- SSLyze Scan ----
      - name: Run SSLyze Scan
        run: |
          pip install --user sslyze
          sslyze $TARGET_URL --json_out $REPORTS_DIR/sslyze-output.json || true
          ls -al $REPORTS_DIR
          cat $REPORTS_DIR/sslyze-output.json || true

      # ---- Upload reports as artifacts ----
      - name: Upload Nikto Report
        uses: actions/upload-artifact@v4
        with:
          name: nikto-report
          path: ${{ env.REPORTS_DIR }}/nikto/nikto-output.xml

      - name: Upload Nmap Report
        uses: actions/upload-artifact@v4
        with:
          name: nmap-report
          path: ${{ env.REPORTS_DIR }}/nmap/nmap.xml

      - name: Upload SSLyze Report
        uses: actions/upload-artifact@v4
        with:
          name: sslyze-report
          path: ${{ env.REPORTS_DIR }}/sslyze-output.json
