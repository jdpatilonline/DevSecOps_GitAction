# =============================================================================
# Veracode CLI -- static scan (GitHub Actions)
#
# The `veracode` CLI runs the same static/pipeline scan engine as the
# Veracode-pipeline-scan-action, but the one binary also does:
#   veracode package        auto-package many languages for scanning
#   veracode scan           container image + IaC + secrets
#   veracode dynamic scan   DAST
#   veracode fix            auto-remediation
# So you can standardize on this instead of separate actions.
#
# Static analysis still needs a COMPILED/PACKAGED artifact (see the build step).
#
# REQUIRED secrets:  reuse the same Veracode API creds as before.
#   VERACODE_API_ID   -> exposed to the CLI as VERACODE_API_KEY_ID
#   VERACODE_API_KEY  -> exposed to the CLI as VERACODE_API_KEY_SECRET
# =============================================================================

name: Veracode CLI (static)

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-scan:
    name: Veracode static scan (CLI)
    runs-on: ubuntu-latest
    env:
      # The CLI reads these exact names; map them from your existing secrets.
      VERACODE_API_KEY_ID: ${{ secrets.VERACODE_API_ID }}
      VERACODE_API_KEY_SECRET: ${{ secrets.VERACODE_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      # 1) Build & package your app into a scannable artifact (adapt to your stack).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build & package
        run: mvn -B clean package        # produces e.g. target/verademo.war

      # 2) Install the Veracode CLI. NOTE: `curl | sh` runs a remote script -- it's
      #    the vendor's official installer, but for hardening consider pinning a
      #    CLI version / verifying a checksum, or gating egress with harden-runner.
      - name: Install Veracode CLI
        run: curl -fsS https://tools.veracode.com/veracode-cli/install | sh
        # The installer drops the `veracode` binary in the workspace -> ./veracode

      # 3) (Optional) Let the CLI auto-package instead of building above:
      # - name: Auto-package
      #   run: ./veracode package --source . --output . --trust

      # 4) Static scan. The CLI returns a non-zero exit when the scan fails your
      #    Veracode policy, which breaks the build = the FAIL GATE.
      - name: Veracode static scan
        run: ./veracode static scan target/verademo.war --results-file results.json
        # For an explicit severity gate independent of policy, add a fail flag
        # (confirm exact flag/values with `./veracode static scan --help`):
        #   ./veracode static scan target/verademo.war --results-file results.json --fail-on-severity high

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veracode-results
          path: results.json
