# =============================================================================
# Veracode -- SAST + Container/IaC + SCA, all via CLI tooling
#
# IMPORTANT: two different binaries are involved.
#   `veracode`  (main CLI)   -> static scan (SAST)  AND  scan --type ... (IaC/
#                               Container/secrets). One binary, one credential
#                               pair (VERACODE_API_KEY_ID / _SECRET).
#   `srcclr`    (SCA agent)  -> Software Composition Analysis. A SEPARATE
#                               binary/installer with its OWN credential
#                               (SRCCLR_API_TOKEN). Veracode has not merged
#                               SCA scanning into the main `veracode` binary --
#                               only `veracode fix sca` (auto-remediation)
#                               *consumes* the SCA results.json afterwards.
#
# REQUIRED secrets:
#   VERACODE_API_ID / VERACODE_API_KEY   -> SAST + IaC/Container
#   SRCCLR_API_TOKEN                     -> SCA (separate credential)
# =============================================================================

name: Veracode (SAST + IaC + SCA)

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) SAST  -- `veracode static scan`  (main CLI)
  # ---------------------------------------------------------------------------
  sast:
    name: SAST (veracode static)
    runs-on: ubuntu-latest
    env:
      VERACODE_API_KEY_ID: ${{ secrets.VERACODE_API_ID }}
      VERACODE_API_KEY_SECRET: ${{ secrets.VERACODE_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Build & package
        run: mvn -B clean package        # -> target/verademo.war (adapt to your stack)

      - name: Install Veracode CLI
        run: curl -fsS https://tools.veracode.com/veracode-cli/install | sh

      - name: SAST scan (gate)
        run: ./veracode static scan target/verademo.war --results-file sast-results.json
        # Non-zero exit on policy failure fails the build.

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sast-results, path: sast-results.json }

  # ---------------------------------------------------------------------------
  # 2) Container / IaC / secrets  -- `veracode scan --type ...`  (same main CLI)
  # ---------------------------------------------------------------------------
  iac-container:
    name: IaC + Container (veracode scan)
    runs-on: ubuntu-latest
    env:
      VERACODE_API_KEY_ID: ${{ secrets.VERACODE_API_ID }}
      VERACODE_API_KEY_SECRET: ${{ secrets.VERACODE_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Veracode CLI
        run: curl -fsS https://tools.veracode.com/veracode-cli/install | sh

      - name: IaC scan (Dockerfiles, k8s manifests, Terraform, CFN)
        run: |
          ./veracode scan --source . --type directory \
            --format json --output iac-results.json
        # Add --policy path/to/policy-container-scan.rego to gate against a
        # custom Veracode policy; exit code reflects policy pass/fail.

      # Optional: also scan a built container image for CVEs/misconfig/secrets.
      # - name: Build image
      #   run: docker build -t myapp:ci .
      # - name: Container image scan (gate)
      #   run: ./veracode scan --source myapp:ci --type image --format json --output container-results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: iac-results, path: iac-results.json }

  # ---------------------------------------------------------------------------
  # 3) SCA  -- `srcclr scan`  (SEPARATE agent CLI, separate credential)
  # ---------------------------------------------------------------------------
  sca:
    name: SCA (srcclr agent)
    runs-on: ubuntu-latest
    env:
      SRCCLR_API_TOKEN: ${{ secrets.SRCCLR_API_TOKEN }}
      # SRCCLR_REGION: ER   # uncomment for Europe (FED for US Federal)
    steps:
      - uses: actions/checkout@v5
      # Set up whatever toolchain srcclr needs to resolve deps (setup-java/node/etc.)

      - name: Install & run SCA agent
        run: |
          curl -sSL https://sca-downloads.veracode.com/ci.sh | sh -s -- \
            scan --json sca-results.json
        # Gate on severity yourself, since exit code alone may not reflect CVSS:
        #   fail if any CRITICAL/HIGH vuln present, e.g. via `jq` on sca-results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sca-results, path: sca-results.json }

      # Optional follow-up, still using the main veracode binary:
      # - name: Auto-fix vulnerable dependencies
      #   run: ./veracode fix sca . --results sca-results.json --remote
