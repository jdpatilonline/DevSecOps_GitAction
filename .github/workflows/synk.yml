name: Snyk Security Scan (PHP)

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  snyk_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'   # adjust to your project’s PHP version

      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer | php
          php composer.phar install --no-progress --no-suggest --prefer-dist

      - name: Run Snyk Scan
        uses: snyk/actions/php@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: test --file=composer.lock --json-file-output=snyk-report.json

      - name: Upload Snyk Report
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json
