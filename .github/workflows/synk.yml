name: Snyk Docker Security Scan

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  snyk_docker_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build your Docker image
      - name: Build Docker image
        run: docker build -t my-php-app:latest -f Dockerfile .

      # Verify the image exists
      - name: List Docker images
        run: docker images

      # Run Snyk scan against the built image
      - name: Run Snyk Container Scan
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: test my-php-app:latest --json-file-output=snyk-report.json

      # Show the report in logs (optional)
      - name: Print Snyk Report
        run: cat snyk-report.json

      # Upload the report as an artifact
      - name: Upload Snyk Report
        uses: actions/upload-artifact@v4
        with:
          name: snyk-docker-report
          path: snyk-report.json
