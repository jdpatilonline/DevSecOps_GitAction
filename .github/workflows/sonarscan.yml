name: SonarCloud Analysis with Quality Gate

on:
#  push:
#    branches:
#      - main
#      - maitreyrbhatt-patch-1
#  pull_request:
#    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # REQUIRED for branch & PR analysis

      - name: show cloned repo
        run: |
          pwd
          ls -al
          dir

      # SonarCloud scan (ALL properties inline)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} #auto‑provided by GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=jdpatilonline
            -Dsonar.projectKey=jdpatilonline_DevSecOps_GitAction
            -Dsonar.projectName=DevSecOps_GitAction
            -Dsonar.sources=.
            -Dsonar.exclusions=**/tests/**,**/docs/**,**/vendor/**,**/*.md
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        continue-on-error: true

      # Fetch Quality Gate status from SonarCloud API
      - name: Fetch Quality Gate Status
        run: |
          #curl -s -u ${{ secrets.SONAR_TOKEN }}: \
          #  "https://sonarcloud.io/api/qualitygates/project_status?projectKey=jdpatilonline_DevSecOps_GitAction" \
          #  | jq '.' > sonarcloud-quality-gate.json
          curl -s -u ${{ secrets.SONAR_TOKEN }}: \
            "https://sonarcloud.io/api/issues/search?componentKeys=jdpatilonline_DevSecOps_GitAction&ps=500" \
            | jq '.' >  sonarcloud-quality-gate.json
          cat sonarcloud-quality-gate.json

      # Upload the summary file as artifact
      - name: Upload SonarCloud Analysis with Quality Gate
        uses: actions/upload-artifact@v4
        with:
          name: SonarCloud Analysis with Quality Gate
          path: sonarcloud-quality-gate.json
